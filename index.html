<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipCutter - Free Video Clip Maker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 16px;
}
.container { max-width: 700px; margin: 0 auto; }
h1 { text-align: center; font-size: 1.8rem; margin: 12px 0 4px; color: #ff5252; }
.subtitle { text-align: center; font-size: 0.85rem; color: #888; margin-bottom: 20px; }
.card {
  background: #1a1a2e; border-radius: 14px; padding: 18px;
  margin-bottom: 14px; border: 1px solid #2a2a4a;
}
.card h2 { font-size: 1.05rem; margin-bottom: 12px; color: #aaa; display: flex; align-items: center; gap: 8px; }
.step-num {
  background: #ff5252; color: white; border-radius: 50%;
  width: 24px; height: 24px; display: flex; align-items: center;
  justify-content: center; font-size: 0.8rem; font-weight: bold;
}
.upload-zone {
  border: 2px dashed #444; border-radius: 10px; padding: 28px;
  text-align: center; cursor: pointer; transition: all 0.2s;
}
.upload-zone:hover { border-color: #ff5252; background: #1a1a3a; }
.upload-zone input { display: none; }
.upload-zone p { color: #888; margin-top: 6px; font-size: 0.85rem; }
#videoPreview { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 10px; display: none; }
.form-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 140px; }
label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; }
select, input[type="number"] {
  width: 100%; padding: 8px 10px; background: #12122a;
  border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 0.9rem;
}
select:focus, input:focus { outline: none; border-color: #ff5252; }
.auto-duration {
  margin-top: 8px; padding: 8px 10px; background: #12122a;
  border-radius: 8px; font-size: 0.82rem; color: #8a8; display: none;
}
.btn {
  display: block; width: 100%; padding: 12px; border: none;
  border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: #ff5252; color: white; }
.btn-primary:hover { background: #e83838; }
.btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; }
.btn-secondary { background: #2a2a4a; color: #e0e0e0; margin-top: 8px; }
.btn-secondary:hover { background: #3a3a5a; }
.progress-wrap { display: none; margin-top: 12px; }
.progress-bar { height: 8px; background: #2a2a4a; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #ff5252, #ff8a80);
  width: 0%; transition: width 0.3s;
}
.progress-text { font-size: 0.78rem; color: #888; text-align: center; }
#resultsSection { display: none; }
.results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.clip-count { font-size: 0.85rem; color: #888; }
.clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.clip-card {
  background: #12122a; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a4a;
}
.clip-card video { width: 100%; height: 90px; object-fit: cover; background: #000; display: block; }
.clip-info { padding: 6px 8px; font-size: 0.72rem; color: #888; }
.clip-info a { color: #ff5252; text-decoration: none; }
.notice {
  background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px;
  padding: 10px; font-size: 0.78rem; color: #8a8; margin-bottom: 14px;
}
.error-box {
  background: #2a1a1a; border: 1px solid #4a2a2a; border-radius: 8px;
  padding: 10px; font-size: 0.78rem; color: #c88; margin-top: 10px;
  display: none; word-break: break-word;
}
#processingVideo { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 ClipCutter</h1>
  <p class="subtitle">Upload → Select ratio & clips → Cut → Shuffle → Download</p>
  <div class="notice">
    ℹ️ No download needed — works entirely in browser! Processing is real-time (a 5s clip takes 5s to cut).
  </div>

  <div class="card">
    <h2><span class="step-num">1</span> Upload Video</h2>
    <label class="upload-zone" for="fileInput">
      <div style="font-size:2rem;">📁</div>
      <p>Tap here to select a video file</p>
      <input type="file" id="fileInput" accept="video/*">
    </label>
    <video id="videoPreview" controls></video>
  </div>

  <div class="card">
    <h2><span class="step-num">2</span> Settings</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Aspect Ratio</label>
        <select id="ratioSelect">
          <option value="16:9">16:9 (YouTube)</option>
          <option value="9:16">9:16 (Shorts/Reels)</option>
          <option value="1:1">1:1 (Square)</option>
          <option value="4:3">4:3 (Classic)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Number of Clips</label>
        <input type="number" id="clipCount" value="4" min="2" max="100">
      </div>
    </div>
    <div class="auto-duration" id="autoDuration">
      Each clip will be ~<span id="durText">0</span> seconds (auto-calculated)
    </div>
  </div>

  <div class="card">
    <h2><span class="step-num">3</span> Cut Clips</h2>
    <button class="btn btn-primary" id="processBtn" disabled>Cut Video into Clips</button>
    <div class="error-box" id="errorBox"></div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">Processing...</div>
    </div>
  </div>

  <div class="card" id="resultsSection">
    <h2><span class="step-num">4</span> Clips Ready!</h2>
    <div class="results-header">
      <span class="clip-count" id="clipCountText"></span>
      <button class="btn btn-secondary" id="shuffleBtn" style="width:auto; padding:6px 14px; margin:0;">🔀 Shuffle</button>
    </div>
    <button class="btn btn-primary" id="downloadAllBtn" style="margin-bottom:10px;">⬇ Download All (ZIP)</button>
    <div class="clips-grid" id="clipsGrid"></div>
  </div>
</div>

<video id="processingVideo" playsinline></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let uploadedFile = null;
let videoDuration = 0;
let clipsData = [];

const fileInput = document.getElementById('fileInput');
const videoPreview = document.getElementById('videoPreview');
const processBtn = document.getElementById('processBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const resultsSection = document.getElementById('resultsSection');
const clipsGrid = document.getElementById('clipsGrid');
const clipCountText = document.getElementById('clipCountText');
const shuffleBtn = document.getElementById('shuffleBtn');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const errorBox = document.getElementById('errorBox');
const autoDuration = document.getElementById('autoDuration');
const durText = document.getElementById('durText');
const clipCountInput = document.getElementById('clipCount');
const processingVideo = document.getElementById('processingVideo');

function showError(msg) { errorBox.textContent = '❌ ' + msg; errorBox.style.display = 'block'; }
function hideError() { errorBox.style.display = 'none'; }

function getSupportedMime() {
  const types = [
    'video/mp4;codecs=h264,aac',
    'video/mp4;codecs=h264',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return { mime: t, ext: t.includes('mp4') ? 'mp4' : 'webm' };
  }
  return { mime: 'video/webm', ext: 'webm' };
}

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  uploadedFile = file;
  hideError();
  const url = URL.createObjectURL(file);
  videoPreview.src = url;
  videoPreview.style.display = 'block';
  processBtn.disabled = false;
  resultsSection.style.display = 'none';
  clipsData = [];
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.src = url;
  v.onloadedmetadata = () => {
    videoDuration = v.duration;
    updateAutoDuration();
  };
});

function updateAutoDuration() {
  const n = parseInt(clipCountInput.value) || 1;
  if (videoDuration > 0) {
    durText.textContent = (videoDuration / n).toFixed(1);
    autoDuration.style.display = 'block';
  }
}
clipCountInput.addEventListener('input', updateAutoDuration);

function getCrop(vw, vh, ratio) {
  let cw, ch, cx, cy;
  switch (ratio) {
    case '16:9':
      cw = vw; ch = Math.round(vw * 9 / 16);
      if (ch > vh) { ch = vh; cw = Math.round(vh * 16 / 9); }
      break;
    case '9:16':
      ch = vh; cw = Math.round(vh * 9 / 16);
      if (cw > vw) { cw = vw; ch = Math.round(vw * 16 / 9); }
      break;
    case '1:1':
      cw = ch = Math.min(vw, vh);
      break;
    case '4:3':
      cw = vw; ch = Math.round(vw * 3 / 4);
      if (ch > vh) { ch = vh; cw = Math.round(vh * 4 / 3); }
      break;
  }
  cx = Math.round((vw - cw) / 2);
  cy = Math.round((vh - ch) / 2);
  const maxDim = 1280;
  let ow = cw, oh = ch;
  if (cw > maxDim || ch > maxDim) {
    if (cw > ch) { ow = maxDim; oh = Math.round(ch * maxDim / cw); }
    else { oh = maxDim; ow = Math.round(cw * maxDim / ch); }
  }
  ow = Math.round(ow / 2) * 2;
  oh = Math.round(oh / 2) * 2;
  return { cw, ch, cx, cy, ow, oh };
}

function cutClip(video, startTime, duration, ratio, audioDest, mimeInfo) {
  return new Promise((resolve, reject) => {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const crop = getCrop(vw, vh, ratio);

    const canvas = document.createElement('canvas');
    canvas.width = crop.ow;
    canvas.height = crop.oh;
    const ctx = canvas.getContext('2d');

    const canvasStream = canvas.captureStream(30);
    const tracks = [...canvasStream.getVideoTracks()];
    if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
      tracks.push(audioDest.stream.getAudioTracks()[0]);
    }
    const combined = new MediaStream(tracks);

    let recorder;
    try {
      recorder = new MediaRecorder(combined, {
        mimeType: mimeInfo.mime,
        videoBitsPerSecond: 6000000
      });
    } catch (e) {
      recorder = new MediaRecorder(combined);
    }

    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      const type = mimeInfo.mime.split(';')[0];
      const blob = new Blob(chunks, { type });
      resolve(blob);
    };
    recorder.onerror = (e) => reject(new Error('Recorder error: ' + e.error));

    const endTime = startTime + duration;

    video.currentTime = startTime;
    video.onseeked = () => {
      try {
        recorder.start(200);
      } catch(e) {
        reject(new Error('Failed to start recorder: ' + e.message));
        return;
      }
      video.play().catch(e => {
        video.muted = true;
        video.play().catch(e2 => reject(new Error('Cannot play video: ' + e2.message)));
      });

      function drawFrame() {
        if (video.paused || video.ended || video.currentTime >= endTime) {
          video.pause();
          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, 250);
          return;
        }
        ctx.drawImage(video, crop.cx, crop.cy, crop.cw, crop.ch, 0, 0, crop.ow, crop.oh);
        requestAnimationFrame(drawFrame);
      }
      drawFrame();
    };
  });
}

processBtn.addEventListener('click', async () => {
  if (!uploadedFile) return;
  hideError();

  const ratio = document.getElementById('ratioSelect').value;
  const numClips = parseInt(clipCountInput.value);

  if (numClips < 2 || numClips > 100) { showError('Clips should be 2-100'); return; }
  if (videoDuration <= 0) { showError('Could not read video duration. Try another file.'); return; }

  const clipDur = videoDuration / numClips;
  const mimeInfo = getSupportedMime();

  processBtn.disabled = true;
  progressWrap.style.display = 'block';
  resultsSection.style.display = 'none';
  clipsData = [];
  progressFill.style.width = '0%';
  progressText.textContent = 'Loading video...';

  try {
    processingVideo.src = URL.createObjectURL(uploadedFile);
    processingVideo.load();

    await new Promise((resolve, reject) => {
      processingVideo.onloadedmetadata = resolve;
      processingVideo.onerror = () => reject(new Error('Cannot load video'));
    });

    let audioCtx = null;
    let audioDest = null;
    try {
      audioCtx = new AudioContext();
      await audioCtx.resume();
      const source = audioCtx.createMediaElementSource(processingVideo);
      audioDest = audioCtx.createMediaStreamDestination();
      source.connect(audioDest);
    } catch (e) {
      console.log('Audio setup failed (video may have no audio):', e);
    }

    for (let i = 0; i < numClips; i++) {
      const startTime = i * clipDur;
      progressText.textContent = 'Cutting clip ' + (i + 1) + ' of ' + numClips + ' (real-time)...';
      progressFill.style.width = Math.round((i / numClips) * 100) + '%';

      const blob = await cutClip(processingVideo, startTime, clipDur, ratio, audioDest, mimeInfo);
      const url = URL.createObjectURL(blob);
      const name = 'clip_' + String(i + 1).padStart(2, '0') + '.' + mimeInfo.ext;
      clipsData.push({ name, blob, url, order: i });
    }

    if (audioCtx) { try { await audioCtx.close(); } catch(e){} }

    progressFill.style.width = '100%';
    progressText.textContent = 'Done!';
    displayClips();

  } catch (err) {
    console.error('Error:', err);
    showError('Error: ' + err.message + '. Try a shorter/smaller video.');
  }

  processBtn.disabled = false;
  progressWrap.style.display = 'none';
});

function displayClips() {
  resultsSection.style.display = 'block';
  clipsGrid.innerHTML = '';
  clipCountText.textContent = clipsData.length + ' clips generated';
  clipsData.forEach((clip, idx) => {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.innerHTML = '<video src="' + clip.url + '" controls preload="metadata"></video>' +
      '<div class="clip-info">#' + (idx + 1) + ' ' + clip.name + '<br>' +
      '<a href="' + clip.url + '" download="' + clip.name + '">⬇ Download</a></div>';
    clipsGrid.appendChild(card);
  });
  resultsSection.scrollIntoView({ behavior: 'smooth' });
}

shuffleBtn.addEventListener('click', () => {
  for (let i = clipsData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [clipsData[i], clipsData[j]] = [clipsData[j], clipsData[i]];
  }
  clipsData.forEach((clip, idx) => {
    const ext = clip.name.split('.').pop();
    clip.name = 'clip_' + String(idx + 1).padStart(2, '0') + '.' + ext;
    clip.order = idx;
  });
  displayClips();
});

downloadAllBtn.addEventListener('click', async () => {
  if (clipsData.length === 0) return;
  downloadAllBtn.disabled = true;
  downloadAllBtn.textContent = '⏳ Creating ZIP...';
  const zip = new JSZip();
  clipsData.forEach((clip, idx) => {
    const ext = clip.name.split('.').pop();
    zip.file('clip_' + String(idx + 1).padStart(2, '0') + '.' + ext, clip.blob);
  });
  const content = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url; a.download = 'all_clips.zip';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  downloadAllBtn.disabled = false;
  downloadAllBtn.textContent = '⬇ Download All (ZIP)';
});
</script>
</body>
          </html>
